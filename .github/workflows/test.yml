name: Clojure CI

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Restore Clojure deps cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('pom.xml') }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-${{ hashFiles('pom.xml') }}-
            ${{ runner.os }}-clojure-
      - uses: actions/setup-java@v2
        with:
          distribution: 'zulu'
          java-version: '11'
      - uses: DeLaGuardo/setup-clojure@3.3
        with: 
          cli: '1.12.0.1479'
          lein: '2.11.2'
      - name: Run tests
        run: clojure -M:test:runner:headless
      - name: Compile splash screen example
        run: |
          cd example-projects/splash
          lein uberjar
      - name: Save Clojure deps cache
        uses: actions/cache/save@v4
        if: steps.restore-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

  publish:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: '1.12.0.1479'
      - name: Restore Clojure deps cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('pom.xml') }}-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-${{ hashFiles('pom.xml') }}-
            ${{ runner.os }}-clojure-
      - name: Determine release version
        id: version
        run: echo "version=$(clojure -T:build print-version)" >> "$GITHUB_OUTPUT"
      - name: Release to Clojars
        env:
          CLOJARS_TOKEN: ${{ secrets.CLOJARS_TOKEN }}
        run: clojure -T:build release

  release:
    if: github.ref == 'refs/heads/master'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          START_TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "$START_TAG" ]; then
            START_TAG="1.10.10"
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            --notes-start-tag "$START_TAG"
